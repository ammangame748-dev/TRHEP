<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم بوت الترحيب الخارق 🚀</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-dark: #161925;
            --accent-neon: #7289da;
            --text-main: #f0f1f5;
            --text-muted: #a0a5b5;
            --border-color: #24293e;
            --success-neon: #00ff87;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        header h1 {
            color: var(--accent-neon);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(114, 137, 218, 0.3);
        }

        header p {
            color: var(--text-muted);
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.4rem;
            color: var(--accent-neon);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
        }

        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-neon);
            box-shadow: 0 0 8px rgba(114, 137, 218, 0.4);
        }

        .variables-hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
            background: #1c2030;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
        }

        .btn {
            background-color: var(--accent-neon);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #5b73c7;
            box-shadow: 0 0 15px rgba(114, 137, 218, 0.4);
        }

        .btn-ai {
            background: linear-gradient(45deg, #8a2387, #e94057, #f27121);
            margin-top: 10px;
        }

        .btn-ai:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(233, 64, 87, 0.4);
        }

        .preview-box {
            background: #090a10;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .preview-img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }

        .range-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>لوحة تحكم بوت الترحيب 🚀</h1>
        <p>تحكم بالإمبيد، النصوص، وتوليد صور الترحيب بالذكاء الاصطناعي</p>
    </header>

    <form id="configForm">
        <div class="grid">
            <!-- اليمين: إعدادات الإمبيد والنصوص -->
            <div class="card">
                <h2>📝 إعدادات الرسائل والإمبيد</h2>
                
                <div class="form-group">
                    <label>رسالة المنشن الخارجية:</label>
                    <input type="text" id="welcomeMessage" name="welcomeMessage">
                    <div class="variables-hint">المتغيرات المدعومة: {user} , {server} , {members}</div>
                </div>

                <div class="form-group">
                    <label>عنوان الإمبيد (Embed Title):</label>
                    <input type="text" id="embedTitle" name="embedTitle">
                </div>

                <div class="form-group">
                    <label>وصف الإمبيد (Embed Description):</label>
                    <textarea id="embedDescription" name="embedDescription" rows="4"></textarea>
                </div>
            </div>

            <!-- اليسار: الذكاء الاصطناعي وتعديل الصورة -->
            <div class="card">
                <h2>🎨 محرك الصور والذكاء الاصطناعي</h2>

                <div class="form-group">
                    <label>توليد خلفية بالذكاء الاصطناعي (اكتب الوصف بالإنجليزية):</label>
                    <input type="text" id="aiPrompt" placeholder="e.g., cyberpunk neon gaming room background, purple theme">
                    <button type="button" class="btn btn-ai" id="generateAI">توليد الخلفية فوراً 🪄</button>
                </div>

                <div class="form-group">
                    <label>رابط الصورة الحالي:</label>
                    <input type="text" id="backgroundImage" name="backgroundImage">
                </div>

                <h2>📍 إحداثيات الصورة والنصوص (Canvas)</h2>
                <div class="range-inputs">
                    <div class="form-group">
                        <label>صورة العضو X (أفقي):</label>
                        <input type="number" id="avatarX" name="avatarX">
                    </div>
                    <div class="form-group">
                        <label>صورة العضو Y (عمودي):</label>
                        <input type="number" id="avatarY" name="avatarY">
                    </div>
                </div>

                <div class="range-inputs">
                    <div class="form-group">
                        <label>حجم دائرة العضو:</label>
                        <input type="number" id="avatarSize" name="avatarSize">
                    </div>
                    <div class="form-group">
                        <label>نص الترحيب X (أفقي):</label>
                        <input type="number" id="textX" name="textX">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>نص الترحيب Y (عمودي):</label>
                    <input type="number" id="textY" name="textY">
                </div>

                <button type="submit" class="btn">حفظ وتطبيق الإعدادات الحالية 💾</button>
            </div>
        </div>
    </form>
</div>

<script>
    // جلب الإعدادات الحالية وعرضها بالخانات عند فتح الصفحة
    async function loadConfig() {
        const response = await fetch('/api/config');
        const config = await response.json();
        
        for (const key in config) {
            const input = document.getElementById(key);
            if (input) input.value = config[key];
        }
    }

    // حفظ الإعدادات عند الضغط على الزر
    document.getElementById('configForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        const response = await fetch('/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        alert(result.message);
    });

    // توليد الصور بالذكاء الاصطناعي عبر API مجاني وسريع (Pollinations.ai)
    document.getElementById('generateAI').addEventListener('click', function() {
        const prompt = document.getElementById('aiPrompt').value;
        if (!prompt) return alert('الرجاء كتابة وصف للصورة أولاً!');
        
        this.innerText = 'جاري التوليد... ⏳';
        
        // بناء رابط الصورة المباشر من محرك الذكاء الاصطناعي
        const cleanPrompt = encodeURIComponent(prompt);
        const aiUrl = `https://pollinations.ai{cleanPrompt}?width=800&height=400&enhanced=true&seed=${Math.floor(Math.random() * 100000)}`;
        
        // وضع الرابط الجديد في خانة الخلفية وتنبيه المستخدم
        document.getElementById('backgroundImage').value = aiUrl;
        this.innerText = 'تم التوليد بنجاح! 🎉';
        alert('تم توليد خلفية الذكاء الاصطناعي وتجهيزها! اضغط على "حفظ وتطبيق" لتفعيلها بالبوت.');
    });

    // تحميل البيانات تلقائياً
    loadConfig();
</script>

</body>
</html>
