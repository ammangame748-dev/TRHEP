<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الكلان</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.0/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .container-main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* Server selector styles */
        .server-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .server-btn {
            padding: 0.75rem 1.5rem;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(51, 65, 85, 0.7);
            color: #cbd5e1;
            border-radius: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.95rem;
            min-width: 200px;
            justify-content: center;
        }

        .server-btn:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .server-btn.active {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border-color: #1e40af;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .server-btn img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .tabs-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(51, 65, 85, 0.5);
        }

        .tab-btn {
            padding: 0.75rem 1.25rem;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid transparent;
            color: #cbd5e1;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: #3b82f6;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border-color: #1e40af;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .card {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(51, 65, 85, 0.7);
            border-radius: 1rem;
            padding: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 0.5rem;
            color: #e2e8f0;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            background: rgba(15, 23, 42, 0.95);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(71, 85, 105, 0.8);
            color: #e2e8f0;
            border: 1px solid rgba(100, 116, 139, 0.5);
        }

        .btn-secondary:hover {
            background: rgba(71, 85, 105, 0.95);
            border-color: #8b5cf6;
        }

        .alert {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title i {
            color: #3b82f6;
        }

        .divider {
            height: 1px;
            background: rgba(51, 65, 85, 0.5);
            margin: 2rem 0;
        }

        /* Loading state */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container-main {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.75rem;
            }

            .card {
                padding: 1.5rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .server-selector {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div class="container-main">
        <div class="header">
            <h1><i class="fas fa-bolt"></i> لوحة تحكم الكلان</h1>
            <p>إدارة متقدمة لكلاناتك</p>
        </div>

        <!-- Server Selector -->
        <div class="card" style="margin-bottom: 1.5rem;">
            <div class="section-title">
                <i class="fas fa-server"></i>
                اختر السيرفر
            </div>
            <div class="server-selector" id="server-selector"></div>
        </div>

        <div class="card" id="settings-card" style="display: none;">
            <div id="alert" class="alert"></div>

            <div class="section-title">
                <i class="fas fa-cogs"></i>
                إعدادات الكلان
            </div>

            <div class="tabs-container" id="tabs-container"></div>

            <form id="clan-settings-form">
                <input type="hidden" id="guildId" name="guildId" value="">
                <input type="hidden" id="clanIndex" name="clanIndex" value="1">

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">اسم الكلان</label>
                        <input type="text" id="clanName" name="clanName" class="form-input" placeholder="أدخل اسم الكلان">
                    </div>

                    <div class="form-group">
                        <label class="form-label">معرف قائد الكلان</label>
                        <input type="text" id="leaderId" name="leaderId" class="form-input" placeholder="معرف العضو">
                    </div>

                    <div class="form-group">
                        <label class="form-label">دور الكلان</label>
                        <select id="roleId" name="roleId" class="form-select"></select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">قناة الدردشة</label>
                        <select id="textChannelId" name="textChannelId" class="form-select"></select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">قناة الصوت</label>
                        <select id="voiceChannelId" name="voiceChannelId" class="form-select"></select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">قناة التقديمات</label>
                        <select id="applyChannelId" name="applyChannelId" class="form-select"></select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">قناة النتائج</label>
                        <select id="resultsChannelId" name="resultsChannelId" class="form-select"></select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">اسم النقاط</label>
                        <input type="text" id="pointsName" name="pointsName" class="form-input" placeholder="مثال: نقطة، عملة">
                    </div>
                </div>

                <div class="divider"></div>

                <div class="section-title">
                    <i class="fas fa-message"></i>
                    محتوى التقديم
                </div>

                <div class="form-group">
                    <label class="form-label">رسالة التقديم</label>
                    <textarea id="applyContent" name="applyContent" class="form-textarea" placeholder="أدخل محتوى رسالة التقديم"></textarea>
                </div>

                <div class="divider"></div>

                <div class="section-title">
                    <i class="fas fa-question-circle"></i>
                    أسئلة التقديم
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">السؤال الأول</label>
                        <input type="text" id="q1" name="q1" class="form-input" placeholder="أدخل السؤال الأول">
                    </div>

                    <div class="form-group">
                        <label class="form-label">السؤال الثاني</label>
                        <input type="text" id="q2" name="q2" class="form-input" placeholder="أدخل السؤال الثاني">
                    </div>

                    <div class="form-group">
                        <label class="form-label">السؤال الثالث</label>
                        <input type="text" id="q3" name="q3" class="form-input" placeholder="أدخل السؤال الثالث">
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i>
                        حفظ الإعدادات
                    </button>
                    <button type="button" id="update-embed-btn" class="btn btn-secondary">
                        <i class="fas fa-sync-alt"></i>
                        تحديث الرسالة
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- GUILD_DATA -->

    <script>
        // بيانات السيرفرات (يتم حقنها من السيرفر)
        const adminGuilds = window.__adminGuilds__ || [];
        // معرف السيرفر الحالي (يتم حقنه عند اختيار سيرفر)
        const initialGuildId = window.__guildId__ || null;

        let currentGuildId = null;
        let allClansData = [];
        let guildMeta = { roles: [], textChannels: [], voiceChannels: [] };

        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;
            setTimeout(() => alert.classList.remove('show'), 4000);
        }

        // Render server selector
        function renderServerSelector() {
            const container = document.getElementById('server-selector');
            container.innerHTML = '';

            if (adminGuilds.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8; text-align: center; padding: 1rem;">لا يوجد لديك صلاحيات إدارية على أي سيرفر.</p>';
                return;
            }

            adminGuilds.forEach(guild => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `server-btn ${currentGuildId === guild.id ? 'active' : ''}`;
                const iconUrl = guild.icon
                    ? `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png`
                    : '';
                btn.innerHTML = `
                    ${iconUrl ? `<img src="${iconUrl}" alt="${guild.name}">` : '<i class="fas fa-server"></i>'}
                    <span>${guild.name}</span>
                `;
                btn.addEventListener('click', () => {
                    selectServer(guild.id);
                });
                container.appendChild(btn);
            });
        }

        function selectServer(guildId) {
            currentGuildId = guildId;
            document.getElementById('guildId').value = guildId;

            // Update active state
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.querySelector(`.server-btn`);
            renderServerSelector();

            // Show settings card
            document.getElementById('settings-card').style.display = 'block';

            // Fetch data
            fetchGuildMeta();
            fetchClans();
        }

        async function fetchGuildMeta() {
            try {
                const res = await fetch(`/api/guild-meta/${currentGuildId}`, { credentials: 'same-origin' });
                if (res.status === 401 || res.redirected) {
                    window.location.href = '/login';
                    return;
                }
                if (!res.ok) throw new Error('Failed to fetch guild meta');
                guildMeta = await res.json();
                populateSelects();
            } catch (error) {
                console.error('Error fetching guild meta:', error);
                showAlert('فشل تحميل بيانات السيرفر', 'error');
            }
        }

        function populateSelects() {
            const selects = {
                roleId: document.getElementById("roleId"),
                textChannelId: document.getElementById("textChannelId"),
                voiceChannelId: document.getElementById("voiceChannelId"),
                applyChannelId: document.getElementById("applyChannelId"),
                resultsChannelId: document.getElementById("resultsChannelId")
            };

            Object.values(selects).forEach(select => {
                select.innerHTML = '<option value="">-- اختر --</option>';
            });

            guildMeta.roles.forEach(role => {
                selects.roleId.innerHTML += `<option value="${role.id}">${role.name}</option>`;
            });

            guildMeta.textChannels.forEach(channel => {
                selects.textChannelId.innerHTML += `<option value="${channel.id}">${channel.name}</option>`;
                selects.applyChannelId.innerHTML += `<option value="${channel.id}">${channel.name}</option>`;
                selects.resultsChannelId.innerHTML += `<option value="${channel.id}">${channel.name}</option>`;
            });

            guildMeta.voiceChannels.forEach(channel => {
                selects.voiceChannelId.innerHTML += `<option value="${channel.id}">${channel.name}</option>`;
            });
        }

        async function fetchClans() {
            try {
                const res = await fetch(`/api/clans/${currentGuildId}`, { credentials: 'same-origin' });
                if (res.status === 401 || res.redirected) {
                    window.location.href = '/login';
                    return;
                }
                if (!res.ok) throw new Error('Failed to fetch clans');
                allClansData = await res.json();
                renderTabs();
                loadClanSettings(1);
            } catch (error) {
                console.error('Error fetching clans:', error);
                showAlert('فشل تحميل بيانات الكلانات', 'error');
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            for (let i = 1; i <= 8; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `tab-btn ${i === 1 ? 'active' : ''}`;
                btn.textContent = `الكلان ${i}`;
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('clanIndex').value = i;
                    loadClanSettings(i);
                });
                container.appendChild(btn);
            }
        }

        function loadClanSettings(clanIndex) {
            const clan = allClansData.find(c => c.clanIndex == clanIndex);
            if (clan) {
                document.getElementById("clanName").value = clan.clanName || '';
                document.getElementById("leaderId").value = clan.leaderId || '';
                document.getElementById("roleId").value = clan.roleId || '';
                document.getElementById("textChannelId").value = clan.textChannelId || '';
                document.getElementById("voiceChannelId").value = clan.voiceChannelId || '';
                document.getElementById("applyChannelId").value = clan.applyChannelId || '';
                document.getElementById("resultsChannelId").value = clan.resultsChannelId || '';
                document.getElementById("applyContent").value = clan.applyContent || '';
                document.getElementById("pointsName").value = clan.pointsName || '';
                document.getElementById("q1").value = clan.questions[0] || '';
                document.getElementById("q2").value = clan.questions[1] || '';
                document.getElementById("q3").value = clan.questions[2] || '';
            }
        }

        document.getElementById("clan-settings-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.guildId = currentGuildId;

            try {
                const res = await fetch("/api/clans/update", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data),
                    credentials: "same-origin"
                });
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                if (res.ok) {
                    showAlert('✓ تم حفظ الإعدادات بنجاح', 'success');
                    fetchClans();
                } else {
                    const errorText = await res.text();
                    showAlert(`✗ ${errorText}`, 'error');
                }
            } catch (error) {
                console.error("Error saving clan settings:", error);
                showAlert('✗ حدث خطأ أثناء الحفظ', 'error');
            }
        });

        document.getElementById("update-embed-btn").addEventListener("click", async () => {
            const clanIndex = document.getElementById("clanIndex").value;
            try {
                const res = await fetch("/api/update-embed", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ guildId: currentGuildId, clanIndex: parseInt(clanIndex) }),
                    credentials: "same-origin"
                });
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                if (res.ok) {
                    showAlert('✓ تم تحديث الرسالة بنجاح', 'success');
                } else {
                    const errorText = await res.text();
                    showAlert(`✗ ${errorText}`, 'error');
                }
            } catch (error) {
                console.error("Error updating embed:", error);
                showAlert('✗ حدث خطأ أثناء التحديث', 'error');
            }
        });

        // Initialize
        renderServerSelector();

        // Auto-select server if guildId was passed
        if (initialGuildId && adminGuilds.some(g => g.id === initialGuildId)) {
            selectServer(initialGuildId);
        } else if (adminGuilds.length === 1) {
            selectServer(adminGuilds[0].id);
        }

        // Hide loading
        document.getElementById('loading').classList.add('hidden');
    </script>
</body>
</html>
