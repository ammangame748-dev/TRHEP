<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الكلانات</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f1f5f9; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
        h1, h2 { text-align: center; color: #38bdf8; }
        .clan-card { background: #334155; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #475569; background: #1e293b; color: white; }
        button { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 20px; width: 100%; }
        button:hover { background: #0369a1; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>إعدادات الكلانات</h1>
        <form action="/api/clans/update" method="POST">
            <input type="hidden" name="guildId" id="guildId">
            <label>اختر الكلان لتعديله:</label>
            <select id="clanSelector" name="clanIndex" onchange="loadClanData()"></select>

            <div class="clan-card">
                <div class="grid">
                    <div>
                        <label>اسم الكلان</label>
                        <input type="text" name="clanName" id="clanName">
                    </div>
                    <div>
                        <label>ID القائد</label>
                        <input type="text" name="leaderId" id="leaderId">
                    </div>
                </div>

                <div class="grid">
                    <div>
                        <label>رتبة الكلان</label>
                        <select name="roleId" id="roleId"></select>
                    </div>
                    <div>
                        <label>اسم النقاط</label>
                        <input type="text" name="pointsName" id="pointsName">
                    </div>
                </div>

                <div class="grid">
                    <div>
                        <label>روم الشات</label>
                        <select name="textChannelId" id="textChannelId"></select>
                    </div>
                    <div>
                        <label>روم الصوت</label>
                        <select name="voiceChannelId" id="voiceChannelId"></select>
                    </div>
                </div>

                <div class="grid">
                    <div>
                        <label>روم التقديم</label>
                        <select name="applyChannelId" id="applyChannelId"></select>
                    </div>
                    <div>
                        <label>روم النتائج</label>
                        <select name="resultsChannelId" id="resultsChannelId"></select>
                    </div>
                </div>

                <label>محتوى رسالة التقديم</label>
                <textarea name="applyContent" id="applyContent" rows="3"></textarea>

                <h3>أسئلة التقديم</h3>
                <input type="text" name="q1" id="q1" placeholder="السؤال الأول">
                <input type="text" name="q2" id="q2" placeholder="السؤال الثاني" style="margin-top:5px;">
                <input type="text" name="q3" id="q3" placeholder="السؤال الثالث" style="margin-top:5px;">
            </div>

            <button type="submit">حفظ التعديلات</button>
        </form>
    </div>

    <script>
        const guildId = window.location.pathname.split('/').pop();
        document.getElementById('guildId').value = guildId;

        async function init() {
            // تحميل القنوات والرتب
            const meta = await fetch(`/api/guild-meta/${guildId}`).then(r => r.json());
            
            const fillSelect = (id, items, type) => {
                const s = document.getElementById(id);
                s.innerHTML = '<option value="">اختر ' + type + '</option>';
                items.forEach(i => {
                    const opt = document.createElement('option');
                    opt.value = i.id;
                    opt.textContent = i.name;
                    s.appendChild(opt);
                });
            };

            fillSelect('roleId', meta.roles, 'رتبة');
            fillSelect('textChannelId', meta.textChannels, 'قناة كتابية');
            fillSelect('voiceChannelId', meta.voiceChannels, 'قناة صوتية');
            fillSelect('applyChannelId', meta.textChannels, 'قناة كتابية');
            fillSelect('resultsChannelId', meta.textChannels, 'قناة كتابية');

            // تحميل الكلانات
            const clans = await fetch(`/api/clans/${guildId}`).then(r => r.json());
            const selector = document.getElementById('clanSelector');
            clans.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.clanIndex;
                opt.textContent = 'كلان ' + c.clanIndex + (c.clanName ? ': ' + c.clanName : '');
                selector.appendChild(opt);
            });

            window.allClans = clans;
            loadClanData();
        }

        function loadClanData() {
            const idx = document.getElementById('clanSelector').value;
            const clan = window.allClans.find(c => c.clanIndex == idx);
            if (!clan) return;

            document.getElementById('clanName').value = clan.clanName || '';
            document.getElementById('leaderId').value = clan.leaderId || '';
            document.getElementById('roleId').value = clan.roleId || '';
            document.getElementById('pointsName').value = clan.pointsName || 'نقطة';
            document.getElementById('textChannelId').value = clan.textChannelId || '';
            document.getElementById('voiceChannelId').value = clan.voiceChannelId || '';
            document.getElementById('applyChannelId').value = clan.applyChannelId || '';
            document.getElementById('resultsChannelId').value = clan.resultsChannelId || '';
            document.getElementById('applyContent').value = clan.applyContent || '';
            document.getElementById('q1').value = clan.questions[0] || '';
            document.getElementById('q2').value = clan.questions[1] || '';
            document.getElementById('q3').value = clan.questions[2] || '';
        }

        init();
    </script>
</body>
</html>
